ica, Arial, sans-serif" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">CH</tspan><tspan dy="5.1" font-size="11.9">3</tspan></text><text x="421.9" y="158" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#047857" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">HO</tspan></text><text x="448.6" y="178.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">H</tspan></text><line x1="320" y1="40" x2="320" y2="220" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="320" y="34.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="12">mirror</tspan></text><circle cx="180" cy="130" r="13" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="460" cy="130" r="13" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/><text x="320" y="250.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="13">Four different groups on one carbon (red ring): the two cannot be laid on each other,</tspan></text><text x="320" y="268.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="13">like a left and a right hand. Each is the other’s enantiomer.</tspan></text></svg>
