<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img"><title>Electrophilic addition of HBr to propene (Markovnikov’s rule)</title><line x1="58.1" y1="110" x2="85.8" y2="110" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="114.2" y1="107" x2="141.9" y2="107" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="114.2" y1="113" x2="141.9" y2="113" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="226.6" y1="110" x2="249" y2="110" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="40" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">H</tspan><tspan dy="5.1" font-size="11.9">3</tspan><tspan dy="-5.1" font-size="17">C</tspan></text><text x="100" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">CH</tspan></text><text x="160" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">CH</tspan><tspan dy="5.1" font-size="11.9">2</tspan></text><text x="218" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c2410c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">H</tspan></text><text x="262" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">Br</tspan></text><path d="M130,104 C144.4,69.1 194.8,65.5 214,98" fill="none" stroke="#dc2626" stroke-width="1.8"/><polygon points="214,98 206.7,92.8 213,89.1" fill="#dc2626"/><path d="M238,115 C239.3,131.6 256.1,136.4 266,123" fill="none" stroke="#dc2626" stroke-width="1.8"/><polygon points="266,123 264.1,131.8 258.2,127.4" fill="#dc2626"/><text x="150" y="172.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="13">propene + HBr</tspan></text><text x="150" y="192.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="12">step 1 (slow)</tspan></text><line x1="292" y1="110" x2="342" y2="110" stroke="#1f2937" stroke-width="2"/><polygon points="348,110 338,114.5 338,105.5" fill="#1f2937"/><line x1="406.1" y1="110" x2="431.8" y2="110" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="460.2" y1="110" x2="487.9" y2="110" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="388" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">H</tspan><tspan dy="5.1" font-size="11.9">3</tspan><tspan dy="-5.1" font-size="17">C</tspan></text><text x="446" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">CH</tspan></text><text x="506" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">CH</tspan><tspan dy="5.1" font-size="11.9">3</tspan></text><text x="455" y="100" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="16">+</tspan></text><text x="446" y="174" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="17">Br</tspan></text><text x="460.7" y="164.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="15">−</tspan></text><circle cx="431" cy="171.4" r="2" fill="#1f2937"/><circle cx="431" cy="164.6" r="2" fill="#1f2937"/><circle cx="449.4" cy="181" r="2" fill="#1f2937"/><circle cx="442.6" cy="181" r="2" fill="#1f2937"/><path d="M436,154 C416.2,145.3 418.6,127.3 440,124" fill="none" stroke="#dc2626" stroke-width="1.8"/><polygon points="440,124 432.4,128.9 431.3,121.6" fill="#dc2626"/><text x="446" y="204.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="13">2° carbocation (more stable)</tspan></text><text x="446" y="224.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="12">step 2 (fast)</tspan></text><line x1="538" y1="110" x2="588" y2="110" stroke="#1f2937" stroke-width="2"/><polygon points="594,110 584,114.5 584,105.5" fill="#1f2937"/><line x1="648.1" y1="110" x2="673.8" y2="110" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="702.2" y1="110" x2="727.9" y2="110" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="688" y1="120.5" x2="688" y2="151.5" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="630" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">H</tspan><tspan dy="5.1" font-size="11.9">3</tspan><tspan dy="-5.1" font-size="17">C</tspan></text><text x="688" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">CH</tspan></text><text x="746" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">CH</tspan><tspan dy="5.1" font-size="11.9">3</tspan></text><text x="688" y="168" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#047857" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">Br</tspan></text><text x="688" y="204.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="13">2-bromopropane (major)</tspan></text><rect x="20" y="238" width="740" height="50" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/><text x="390" y="260.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="13">H goes to the CH</tspan><tspan dy="3.9" font-size="9.1">2</tspan><tspan dy="-3.9" font-size="13"> end (the carbon that already has more H); Br ends on the more substituted carbon.</tspan></text><text x="390" y="280.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="13">H on the middle carbon would leave a 1° carbocation → 1-bromopropane, the minor product.</tspan></text></svg>
