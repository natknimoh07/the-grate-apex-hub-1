 stroke-linecap="round"/><text x="322" y="236.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="13">water</tspan></text><line x1="391.4" y1="82.8" x2="381" y2="74.1" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="408.6" y1="88.5" x2="433.6" y2="84.1" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="400" y="96" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c2410c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">O</tspan></text><text x="372.4" y="72.8" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">H</tspan></text><text x="461.1" y="85.2" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">CH</tspan><tspan dy="5.1" font-size="11.9">2</tspan><tspan dy="-5.1" font-size="17">CH</tspan><tspan dy="5.1" font-size="11.9">3</tspan></text><line x1="351.5" y1="134.8" x2="391.2" y2="98.1" stroke="#2563eb" stroke-width="2.4" stroke-dasharray="2 5" stroke-linecap="round"/><text x="440" y="218.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="600"><tspan dy="0" font-size="14">· · ·  hydrogen bond</tspan></text><text x="300" y="266.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="13">In O–H the H is δ+ and the O δ−. Boiling means breaking these bonds (high boiling point);</tspan></text><text x="300" y="284.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="13">making them with water lets small alcohols dissolve.</tspan></text></svg>
