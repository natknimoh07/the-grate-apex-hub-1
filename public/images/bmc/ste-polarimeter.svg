<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img"><title>A polarimeter: an enantiomer rotates plane-polarised light</title><circle cx="50" cy="100" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="50" y="148.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="12">light</tspan></text><line x1="80" y1="100" x2="130" y2="100" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/><line x1="121" y1="100" x2="89" y2="100" stroke="#d97706" stroke-width="1.6" stroke-linecap="round"/><line x1="116.3" y1="88.7" x2="93.7" y2="111.3" stroke="#d97706" stroke-width="1.6" stroke-linecap="round"/><line x1="105" y1="84" x2="105" y2="116" stroke="#d97706" stroke-width="1.6" stroke-linecap="round"/><line x1="93.7" y1="88.7" x2="116.3" y2="111.3" stroke="#d97706" stroke-width="1.6" stroke-linecap="round"/><rect x="140" y="60" width="14" height="80" rx="3" fill="#e0e7ff" stroke="#2563eb" stroke-width="1.4"/><text x="147" y="162.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="12">polariser</tspan></text><line x1="162" y1="100" x2="222" y2="100" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/><line x1="192" y1="80" x2="192" y2="120" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/><text x="192" y="72.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="12">one plane</tspan></text><rect x="232" y="74" width="200" height="52" rx="26" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/><text x="332" y="104.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="13">one enantiomer in solution</tspan></text><line x1="440" y1="100" x2="520" y2="100" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/><line x1="480" y1="78" x2="480" y2="122" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="491" y1="80.9" x2="469" y2="119.1" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/><text x="480" y="70.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="12">rotated by α</tspan></text><rect x="530" y="60" width="14" height="80" rx="3" fill="#e0e7ff" stroke="#2563eb" stroke-width="1.4"/><text x="537" y="162.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="12">analyser</tspan></text><text x="566" y="94.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="600"><tspan dy="0" font-size="14">clockwise: (+), d</tspan></text><text x="566" y="118.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="600"><tspan dy="0" font-size="14">anticlockwise: (−), l</tspan></text><text x="380" y="200.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="13">The other enantiomer turns the plane by the same angle the other way;</tspan></text><text x="380" y="220.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="13">a racemic (±) mixture does not turn it at all.</tspan></text></svg>
