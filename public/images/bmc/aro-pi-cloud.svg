 118.6,169.9 133,186 Z" fill="#60a5fa" fill-opacity="0.45" stroke="#60a5fa" stroke-width="1.2"/><path d="M133,186 C118.6,202.1 121,232 133,232 C145,232 147.4,202.1 133,186 Z" fill="#60a5fa" fill-opacity="0.45" stroke="#60a5fa" stroke-width="1.2"/><line x1="281.1" y1="155.5" x2="245" y2="180.5" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="229.1" y1="186" x2="141" y2="186" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="125.1" y1="180.5" x2="89" y2="155.5" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="89" y1="144.5" x2="125" y2="119.5" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="140.9" y1="114" x2="229" y2="114" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="244.9" y1="119.5" x2="281.1" y2="144.5" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="289" y="155.3" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="15">C</tspan></text><text x="237" y="191.3" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="15">C</tspan></text><text x="133" y="191.3" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="15">C</tspan></text><text x="81" y="155.3" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="15">C</tspan></text><text x="133" y="119.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="15">C</tspan></text><text x="237" y="119.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="15">C</tspan></text><text x="330" y="64.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="400"><tspan dy="0" font-size="14">six p orbitals, one on each sp</tspan><tspan dy="-5.9" font-size="9.8">2</tspan><tspan dy="5.9" font-size="14"> carbon,</tspan></text><text x="330" y="84.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="400"><tspan dy="0" font-size="14">each holding one electron</tspan></text><text x="330" y="134.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="600"><tspan dy="0" font-size="14">they overlap all round the ring:</tspan></text><text x="330" y="154.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="600"><tspan dy="0" font-size="14">a continuous π cloud above and</tspan></text><text x="330" y="174.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="600"><tspan dy="0" font-size="14">below the flat ring</tspan></text><text x="330" y="224.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="400"><tspan dy="0" font-size="14">6 π electrons fill the three bonding</tspan></text><text x="330" y="244.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="400"><tspan dy="0" font-size="14">orbitals: very stable, so benzene</tspan></text><text x="330" y="264.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="400"><tspan dy="0" font-size="14">resists addition</tspan></text></svg>
