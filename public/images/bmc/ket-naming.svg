)</tspan></text><text x="470" y="261.6" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700"><tspan dy="0" font-size="16">3-methyl-2-pentanone</tspan></text></svg>
