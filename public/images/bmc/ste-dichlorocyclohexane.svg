: one toward, one away</tspan></text><text x="460" y="256.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="13">no plane of symmetry → two enantiomers</tspan></text></svg>
