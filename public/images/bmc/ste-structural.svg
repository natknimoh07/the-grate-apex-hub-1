oke"><tspan dy="0" font-size="17">CH</tspan><tspan dy="5.1" font-size="11.9">3</tspan></text><text x="446" y="96" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c2410c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">O</tspan></text><text x="512" y="96" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">CH</tspan><tspan dy="5.1" font-size="11.9">3</tspan></text><text x="150" y="145.3" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="15">ethanol: an alcohol (C–O–H)</tspan></text><text x="446" y="145.3" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="15">dimethyl ether: an ether (C–O–C)</tspan></text><text x="300" y="34.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="13">Same formula, C</tspan><tspan dy="3.9" font-size="9.1">2</tspan><tspan dy="-3.9" font-size="13">H</tspan><tspan dy="3.9" font-size="9.1">6</tspan><tspan dy="-3.9" font-size="13">O; atoms joined in a different order</tspan></text><text x="300" y="180.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="12">Different connections, different compounds and properties</tspan></text></svg>
