" y2="134" stroke="#7c3aed" stroke-width="2"/><polygon points="170,128 174.5,138 165.5,138" fill="#7c3aed"/><text x="170" y="34.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="13">Aldehyde: one large group</tspan></text><text x="170" y="230.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="12">room to approach; the C=O carbon</tspan></text><text x="170" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="12">is more δ+ (one alkyl group)</tspan></text><line x1="497" y1="99.5" x2="497" y2="74.5" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="503" y1="99.5" x2="503" y2="74.5" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="491.4" y1="115" x2="468.8" y2="128" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="508.6" y1="115" x2="526.8" y2="125.5" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="500" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">C</tspan></text><text x="500" y="70" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c2410c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">O</tspan></text><text x="460.2" y="139" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan dy="0" font-size="17">R</tspan></text><text x="539.8" y="139" font-family="Helvetica, Arial, sans-serif" font-size="1