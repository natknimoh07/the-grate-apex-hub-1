name: Atlas Z-Anatomy Model Pipeline
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inventory only, pilot export, or all-system export'
        required: true
        type: choice
        options: [inventory, pilot, export]
        default: inventory
      config_path:
        description: 'Reviewed system mapping JSON'
        required: false
        type: string
        default: 'atlas-upgrade/systems.reviewed.json'
      lite_ratio:
        description: 'Mobile decimation ratio (0.1–1.0)'
        required: false
        type: string
        default: '0.58'
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and source tools
        run: sudo apt-get update && sudo apt-get install -y blender unzip curl
      - name: Stage and verify Z-Anatomy source
        run: ./atlas-upgrade/pipeline/fetch-source.sh
      - name: Inventory source collections
        run: |
          BLEND="$(cat atlas-upgrade/source/BLEND_PATH)"
          blender -b "$BLEND" --python-exit-code 1 -P atlas-upgrade/pipeline/inventory_blend.py -- \
            --out atlas-upgrade/output/collection-inventory.json
      - name: Pilot export (skeletal + muscular insertions)
        if: inputs.mode == 'pilot'
        run: |
          BLEND="$(cat atlas-upgrade/source/BLEND_PATH)"
          blender -b "$BLEND" --python-exit-code 1 -P atlas-upgrade/pipeline/export_collections.py -- \
            --config "${{ inputs.config_path }}" \
            --only skeletal,muscular_insertions \
            --out atlas-upgrade/output/glb \
            --lite-ratio "${{ inputs.lite_ratio }}"
          python3 - <<'PY'
          from pathlib import Path
          required = ['skeletal.glb', 'skeletal-lite.glb', 'muscular_insertions.glb', 'muscular_insertions-lite.glb']
          out = Path('atlas-upgrade/output/glb')
          missing = [name for name in required if not (out / name).is_file() or (out / name).stat().st_size < 1024]
          if missing:
              raise SystemExit('Pilot GLB validation failed; missing/empty: ' + ', '.join(missing))
          print('Pilot output validated:', ', '.join(required))
          PY
      - name: Export all reviewed systems
        if: inputs.mode == 'export'
        run: |
          BLEND="$(cat atlas-upgrade/source/BLEND_PATH)"
          blender -b "$BLEND" --python-exit-code 1 -P atlas-upgrade/pipeline/export_collections.py -- \
            --config "${{ inputs.config_path }}" \
            --out atlas-upgrade/output/glb \
            --lite-ratio "${{ inputs.lite_ratio }}"
      - name: Upload inventory and exports
        uses: actions/upload-artifact@v4
        with:
          name: atlas-z-anatomy-${{ inputs.mode }}
          path: atlas-upgrade/output/
          if-no-files-found: error
          retention-days: 14
